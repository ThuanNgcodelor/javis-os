tunnel: n8n-dinhduongcantho
# credentials-file: /Users/hyden/.cloudflared/<TUNNEL_ID>.json

ingress:
  # --------------------------------------------------------------------------
  # 1. CFC AI - Open WebUI (Port 3000) -> MỚI THÊM VÀO ĐÂY
  # --------------------------------------------------------------------------
  - hostname: ai.dinhduongcantho.io.vn
    service: http://localhost:3000

  # --------------------------------------------------------------------------
  # 2. n8n Service (Port 5678)
  # --------------------------------------------------------------------------
  - hostname: n8n.dinhduongcantho.io.vn
    service: http://localhost:5678

  # --------------------------------------------------------------------------
  # 3. JAVIS OS (Port 7777) - Unified Brain & Dashboard
  # --------------------------------------------------------------------------
  - hostname: dinhduongcantho.io.vn
    service: http://localhost:7777

  - hostname: api.dinhduongcantho.io.vn
    service: http://localhost:7777

  # --------------------------------------------------------------------------
  # 4. Catch-all rule (Bắt buộc nằm cuối cùng)
  # --------------------------------------------------------------------------
  - service: http_status:404
